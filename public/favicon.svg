<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CWT Group">
  <!--
    CWT Group favicon. public/favicon.svg is the single source of truth for the
    mark: src/lib/icon.ts rasterizes THIS file into favicon-32.png,
    apple-touch-icon.png, icon-192/512.png and icon-maskable-512.png.

    The wordmark has the "Precision Welding Services" strapline cropped off —
    the same artwork as the avatar. At 16-32px the strapline is a smudge, and
    dropping it lets the letters fill the square.

    It is an embedded bitmap rather than paths because CWT has no vector
    original to hand. The source is 640px wide and the largest the mark is ever
    rasterized to is 384px (icon-512 at padding 0.1), so it never upscales. It
    is baked onto opaque white rather than kept transparent: a palette image
    quantizes the alpha channel and frays the letter edges, and the mark sits on
    the white plate below anyway. Drop in a real vector here if the original
    artwork turns up.

    That white plate matters: the wordmark is dark navy, so on a transparent
    favicon it would disappear into a dark browser tab. The mark is sized to
    58.0/64 of the square so it stays inside the Android maskable safe zone
    (half-diagonal 192px against a 205px safe radius at 512).
  -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <image xlink:href="data:image/png;base64,"
         x="3.0" y="24.07" width="58.0" height="15.86"/>
</svg>
