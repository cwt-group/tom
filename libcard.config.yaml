# yaml-language-server: $schema=./libcard.schema.json
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  This is the ONLY file you need to edit to make LibCard your own.    │
# │  Change the values below, commit, and push — GitHub Pages rebuilds.  │
# │  To pull in new themes/features later: `pnpm run update` — it leaves │
# │  this file untouched. Full guide: docs/UPGRADING.md                  │
# └─────────────────────────────────────────────────────────────────────┘
#
# Tom Gilbert — digital business card for CWT Group. Intended for
# https://cwt-group.github.io/tom/. Styling follows the house card at
# https://johnsilvaeng.github.io/card (same silva theme and card-mode setup).

# --- Who you are (the card header) ---
profile:
  name: Tom Gilbert
  tagline: Works Director
  # DELIBERATELY NOT A PHOTOGRAPH. Tom does not want his likeness published, so
  # the avatar is the CWT Group logo on a white square. The avatar renders in a
  # circle (object-cover), so the mark is inset with ~42px of clearance at
  # 400x400 — the circle cannot clip it. The rest of the build carries no
  # portrait either: the vCard (src/lib/vcard.ts) has no PHOTO property, the
  # Open Graph image (src/pages/og.png.ts) is drawn from theme tokens and text
  # only, and the favicon/app icons are rasterized from public/favicon.svg.
  avatar: /tom.png # public/tom.png
  location: Kettering, Northants, UK

# --- Contact details ---
# These power the "Save contact" button (a downloadable vCard) and the QR card.
contact:
  email: tom@cwt-group.com
  # Company switchboard, extension 2. This string is never displayed — it only
  # feeds the tel: link and the vCard, so it has to dial correctly:
  #   - no "(0)": with +44 the trunk 0 must be dropped. A dialer that strips the
  #     parens but keeps the 0 would try +4401536… and fail.
  #   - ",,2": each comma is a ~2s pause, then DTMF 2. This is what actually
  #     reaches the extension on iOS and Android; "Ext.2" as text does not dial.
  #   - no spaces: they end up unencoded in the tel: URI, which RFC 3966 forbids.
  #     Browsers tolerate it, but there is no reason to depend on that.
  phone: "+441536412828,,2"
  organization: CWT Group
  title: Works Director
  website: https://cwt-group.com # the URL saved into the vCard

# --- Social icon row (icon-only, shown above the links) ---
# Deliberately empty. The only profile worth linking is LinkedIn, and there is
# already a full-width LinkedIn button in `links:` below — the small circular
# icon above it would be the same destination twice. `socials` defaults to [],
# so omitting it renders no row at all.

# --- Your links (the buttons) ---
links:
  - label: CWT Group
    url: https://cwt-group.com
    icon: globe
  - label: LinkedIn
    url: https://www.linkedin.com/in/tom-gilbert-8b8764104/
    icon: linkedin

# --- Rich content blocks (optional, ordered) ---
# Kept to one: tap-to-call and tap-to-email, which is what a card is for.
blocks:
  - type: contact-buttons
    call: true # uses contact.phone above
    email: true # uses contact.email above

# --- Look & feel ---
theme:
  name: silva # custom theme in themes/silva.yaml
  switcher: false # off: a business card should not offer to restyle itself (also keeps it zero-JS)
  animate: false

# --- Footer credit ---
footer:
  poweredBy: true # LibCard is MIT — the credit stays
  themeCredit: false # silva is an in-house theme (MIT), so the credit would be noise

# --- SEO / link previews (optional) ---
seo:
  description: Works Director at CWT Group — precision laser welding.

# --- Landscape "card mode" (rotate your phone to flash a business card) ---
cardMode:
  enabled: true # landscape business-card overlay + portrait rotate hint
  qr: page # scan -> opens this card, which carries the Save-contact button
  hint: true # the subtle "⟲ Rotate to show your card" nudge in portrait
  wakeLock: true # keep the screen lit while you hold the card up to someone

# --- Analytics ---
# Deliberately omitted. `getAnalytics()` returns null when this block is absent,
# so the page ships no beacon, no pixel, no cookies and no third-party request.

# --- Where this site lives ---
# base: "/repo-name" for project pages. Getting it wrong breaks every asset.
site:
  url: https://cwt-group.github.io
  base: "/tom"
